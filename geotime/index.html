<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
<title>深时时间线 · 地球与生命 40 亿年</title>
<style>
  :root { --evolution:#6A994E; --genetics:#BC4749; --molecule:#2A6F97;
          --diversity:#9C6644; --frontier:#7F5AF0; --cell:#2E86AB;
          --bg:#FAF9F6; --ink:#222; }
  * { margin:0; padding:0; box-sizing:border-box; }
  html,body { height:100%; background:var(--bg); overflow:hidden; color:var(--ink); }
  body { font-family:"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif; }
  header { padding:10px 28px 2px; }
  header h1 { font-size:33px; font-weight:700; display:inline; }
  header p { font-size:20px; color:#777; margin-top:2px; }

  .legend { display:flex; gap:10px; padding:4px 28px 0; font-size:14px; flex-wrap:nowrap; white-space:nowrap; justify-content:flex-start; }
  .legend span { display:inline-flex; align-items:center; gap:5px; cursor:pointer; padding:4px 12px;
                 border-radius:8px; border:1.5px solid transparent; transition:all .15s; }
  .legend span:hover { background:#e8e5de; border-color:#c9c5bd; }
  .legend i { width:11px; height:11px; border-radius:50%; display:inline-block; }

  body { display:flex; flex-direction:column; height:100vh; overflow:hidden; }
  #viewport { position:relative; flex:1 1 auto; min-height:0; overflow:hidden; cursor:grab; }
  #viewport.dragging { cursor:grabbing; }
  #timeline { position:relative; height:100%; width:16000px;
              transform-origin:0 0; will-change:transform; }

  .axis { position:absolute; left:0; right:0; top:50%; height:3px;
          background:#555; border-radius:2px; }
  .track-label { position:absolute; font-size:19px; font-weight:700; letter-spacing:2px;
                 color:#fff; padding:5px 14px; border-radius:14px; top:-52px; white-space:nowrap; }
  .track-label.tech { background:var(--evolution); left:24px; }
  .track-label.data { background:#8a8578; left:200px; }
  .tick { position:absolute; top:calc(50% - 7px); width:1.5px; height:10px; background:#999; }
  .tick-label { position:absolute; top:calc(50% + 5px); transform:translateX(-50%);
                font-size:22px; color:#888; font-family:Georgia,serif; }
  .era { position:absolute; bottom:20px; font-size:23px; color:#8a8578;
         border-left:2px solid #d8d4ca; padding-left:8px; white-space:nowrap; }
  .era b { display:block; font-size:26px; color:#555; }
  .era .core { display:block; font-size:19px; color:#999; margin-top:2px; max-width:360px; white-space:normal; line-height:1.5; }
  .tech-diamond { width:13px; height:13px; background:var(--evolution); transform:rotate(45deg); margin:0 auto; border:2px solid #fff; box-shadow:0 1px 3px rgba(0,0,0,.3); }
  .tech-name { font-size:15px; color:var(--evolution); font-weight:600; margin-top:6px; line-height:1.25; }
  .tech-link { position:absolute; top:calc(50% + 40px); height:0; border-top:2px dashed #6A994E88; z-index:1; }

  /* ===== 底部：宙/代色带 + 纪竖线标签 ===== */
  .periods { position:absolute; bottom:0; left:0; right:0; height:30px; }
  .periods .pcell { position:absolute; bottom:0; display:flex; align-items:center; justify-content:center;
                    overflow:hidden; white-space:nowrap; font-size:17px; font-weight:800; color:#fff;
                    text-shadow:0 1px 2px rgba(0,0,0,.35);
                    border-right:1.5px solid rgba(255,255,255,.55); }
  .pline { position:absolute; bottom:30px; height:72px; width:0;
           border-left:1.5px solid #9aa0a8; opacity:.8; }
  .plabel { position:absolute; bottom:34px; writing-mode:vertical-rl; text-orientation:upright;
            font-size:14px; font-weight:700; white-space:nowrap; color:#3d4450; }

  /* ===== 底部：数据维度扩展带 ===== */
  .dim { position:absolute; top:calc(50% + 48px); height:0; }
  .dim .dseg { position:absolute; bottom:0; border-left:1px dashed #bbb; }
  .dim .dlabel { position:absolute; bottom:0; font-size:20px; color:#666;
                 padding:6px 10px; background:#efede8; border-radius:8px; white-space:nowrap;
                 box-shadow:0 1px 2px rgba(0,0,0,.06); }

  /* ===== 事件节点 ===== */
  .event { position:absolute; transform:translateX(-50%); width:320px;
           transition:transform .18s ease; }
  .event .stem { position:absolute; left:50%; width:2.5px; background:currentColor; }
  .event .dot  { position:absolute; left:50%; transform:translate(-50%,-50%);
                 border-radius:50%; background:currentColor; border:2px solid #fff;
                 box-shadow:0 1px 3px rgba(0,0,0,.25); transition:all .18s ease; }
  .event .card { position:absolute; left:50%; transform:translateX(-50%); width:320px; text-align:center; transition:all .18s ease; }
  .event .name { font-size:22px; font-weight:600; color:var(--ink); line-height:1.35; }
  .event .meta { font-size:17px; color:#888; margin-top:2px; }
  .event.up .card { bottom:calc(100% - 50%); margin-bottom:14px; }
  .event.up .stem { bottom:50%; }
  .event.dn .card { top:calc(100% - 50%); margin-top:14px; }
  .event.dn .stem { top:50%; }
  .event:hover { z-index:50; }
  .event:hover .dot { transform:translate(-50%,-50%) scale(1.7); }
  .event:hover .name { font-size:28px; }
  .tech-ev .name { color:var(--evolution) !important; }
  .tech-ev .meta { color:#4a7c35; }
  .event:hover .meta { font-size:22px; color:#555; }
  .event.up:hover .card { margin-bottom:22px; }
  .event.dn:hover .card { margin-top:22px; }
  .event.s1 { color:var(--molecule); } .event.s2 { color:var(--genetics); }
  .event.s3 { color:var(--diversity); } .event.s4 { color:var(--frontier); }
  .event.ghost { color:#9c968a; }

  #detailTip { position:fixed; width:50vw; min-width:340px; max-width:calc(100vw - 24px); padding:16px 18px; background:#fff;
               border-radius:10px; box-shadow:0 8px 30px rgba(0,0,0,.18); color:#222;
               border-top:4px solid currentColor;
               display:none; z-index:999; text-align:left; font-size:22px; line-height:1.7;
               opacity:0; transition:opacity .35s ease; }
  #detailTip.show { opacity:1; }
  #detailTip h3 { font-size:26px; margin-bottom:4px; }
  #detailTip h3 a { color:inherit; text-decoration:none; border-bottom:2px solid currentColor; }
  #detailTip .who { color:#999; font-size:19px; margin-bottom:6px; }
  #detailTip p { color:#444; }
  #detailTip img { width:100%; max-height:50vh; object-fit:contain; border-radius:8px; border:1px solid #eee; display:block; }
  #detailTip .site { margin-top:8px; font-size:20px; }
  #detailTip .site a { color:#2A6F97; text-decoration:underline; }
  #detailTip .note { margin-top:8px; padding:8px 10px; background:#FBF6EC;
                 border:1px dashed #D4B996; border-radius:8px; line-height:1.65; color:#6B5B3E; }
  #tipClose { position:absolute; top:8px; right:8px; width:30px; height:30px; line-height:1;
              border:none; border-radius:50%; background:rgba(0,0,0,.06); color:#666;
              font-size:16px; cursor:pointer; padding:0; }
  #tipClose:hover { background:rgba(0,0,0,.15); color:#222; }
  /* 字号调节 + 拖拽缩放 */
  .tipFontCtl { position:absolute; top:8px; right:44px; display:flex; align-items:center; gap:2px;
                font-size:13px; color:#666; user-select:none; z-index:2; }
  .tipFontCtl button { width:24px; height:24px; line-height:1; border:none; border-radius:50%;
                background:rgba(0,0,0,.06); color:#666; font-size:14px; cursor:pointer; padding:0; }
  .tipFontCtl button:hover { background:rgba(0,0,0,.15); color:#222; }
  .tipFontCtl span { min-width:30px; text-align:center; cursor:default; font-variant-numeric:tabular-nums; }
  #tipResize { position:absolute; left:0; bottom:0; width:20px; height:20px; cursor:nesw-resize; z-index:2;
               background:linear-gradient(225deg, transparent 50%, rgba(0,0,0,.18) 50%); border-bottom-left-radius:10px; }
  #detailTip .note b a { color:inherit; text-decoration:underline dotted; text-underline-offset:3px; }

  /* 详情卡组合样式（重构自内联style）*/
  .tech-tag { margin-top:6px; font-size:15px; }
  .tech-pre { color:#2A6F97; }
  .tech-to { color:#4a7c35; }
  .det-flex { display:flex; gap:10px; margin-top:10px; align-items:flex-start; }
  .det-img-link { flex:0 0 38%; }
  .det-img { width:100%; max-height:50vh; object-fit:contain; border-radius:8px; border:1px solid #eee; display:block; margin:0; }
  .det-note { flex:1; margin:0; }
  .det-img-only { margin-top:10px; }
  .det-img-sm { width:38%; max-height:50vh; object-fit:contain; border-radius:8px; border:1px solid #eee; display:block; }
  .det-note-only { margin-top:10px; }
  #detailTip .note { padding:10px 12px; font-size:0.92em; line-height:1.65; color:#55503f; }
  #detailTip .note { padding:8px 10px; background:#FBF6EC;
                 border:1px dashed #D4B996; border-radius:8px; line-height:1.65; color:#6B5B3E; }
  #detailTip .note b { color:#7a6a3f; }
  .lg-static { cursor:default !important; border:none !important; white-space:nowrap; }
  .lg-tour { cursor:pointer; white-space:nowrap; border:1px solid var(--frontier) !important; color:var(--frontier); font-weight:600; }
  .lg-tour.on { background:var(--frontier); color:#fff; }
  .tour-ctl { position:fixed; left:20px; top:118px; display:flex; flex-direction:column; align-items:flex-start; gap:8px; z-index:60; }
  .tour-ctl .lg-tour { padding:8px 14px; font-size:14px; border:1px solid #c9c5bd !important;
              border-radius:20px; background:#fff; color:#555; cursor:pointer; font-weight:400;
              box-shadow:0 2px 8px rgba(0,0,0,.12); }
  .tour-ctl .lg-tour:hover { background:#efede8; }
  .tour-ctl .lg-tour.on { background:var(--frontier); border-color:var(--frontier) !important; color:#fff; font-weight:700; }

  .hint { position:fixed; bottom:14px; left:50%; transform:translateX(-50%);
          background:rgba(40,40,40,.82); color:#fff; font-size:20px;
          padding:7px 16px; border-radius:18px; pointer-events:none; transition:opacity .5s; }

  /* ===== 移动端适配 ===== */
  /* 竖屏窄屏：详情卡改为底部抽屉 */
  @media (max-width:700px){
    #detailTip { left:12px !important; right:12px !important; top:auto !important; bottom:54px !important;
                 width:auto !important; max-height:55vh !important; overflow-y:auto !important; font-size:18px; }
    #detailTip h3 { font-size:21px; }
    header h1 { font-size:22px; }
    header p { font-size:14px; }
    .hint { font-size:14px; width:86vw; }
    .tour-ctl { top:auto; bottom:14px; flex-direction:row; left:12px; gap:6px; flex-wrap:wrap; max-width:96vw; }
    .tour-ctl .lg-tour { padding:6px 10px; font-size:12px; }
    .legend { overflow-x:auto; }
    #viewport { height:calc(100vh - 140px); }
  }
  /* 横屏低高度（手机横屏）：整体缩放 + 允许纵向滚动看到上下内容 */
  @media (orientation:landscape) and (max-height:520px){
    #viewport { overflow-y:auto; }
    header { padding:4px 28px 0; }
    header h1 { font-size:22px; }
    header p { font-size:14px; }
    .hint { font-size:14px; }
    .tour-ctl { top:70px; }
    .tour-ctl .lg-tour { padding:5px 10px; font-size:12px; }
  }
</style>
</head>
<body>
<header>
  <h1>深时时间线 · 地球与生命 40 亿年</h1>
  <p>深时时间线 · 宙/代为底部色带，纪为竖线，⚑ 为大灭绝</p>
</header>

<div class="legend">
  <span class="lg-static" data-cat="life"><i style="background:var(--evolution);"></i>生命跃迁</span>
  <span data-cat="lin" class="lg-plain"><i style="background:var(--genetics)"></i>类群分化</span>
  <span data-cat="env" class="lg-plain"><i style="background:var(--molecule)"></i>地质环境</span>
  <span data-cat="ext" class="lg-plain"><i style="background:#B08430"></i>★ 大灭绝</span>
  <span data-cat="hum" class="lg-plain"><i style="background:var(--frontier)"></i>人类谱系</span>
</div>

<div class="tour-ctl">
  <span id="tourBtn" class="lg-tour" title="时间之旅（空格暂停/继续，Esc 退出）">▶</span>
  <span id="tourPrev" class="lg-tour" title="上一个事件">⏮</span>
  <span id="tourNext" class="lg-tour" title="下一个事件">⏭</span>
  <span id="tourSlower" class="lg-tour" title="停留时间 −1 秒（最少 1 秒）">−</span>
  <span id="tourSecs" style="min-width:34px;text-align:center;cursor:default">6s</span>
  <span id="tourFaster" class="lg-tour" title="停留时间 +1 秒（最多 30 秒）">＋</span>
  <span id="fsBtn" class="lg-tour" title="进入/退出全屏">⛶</span>
</div>

<div id="viewport"><div id="timeline"><div class="axis"></div></div></div>
<div class="hint" id="hint">← 拖动 / 滚轮滑动，Ctrl/⌘+滚轮缩放 · 轴上为宙/代、轴下色带为纪 · ⚑ 悬停看大灭绝 · 时间之旅：空格暂停 →</div>

<script src="data.js"></script>
<script>

const CAT_COLOR = {life:"var(--evolution)", lin:"var(--genetics)", env:"var(--molecule)", ext:"#B08430", hum:"var(--frontier)"};
const T0=4567, T1=0, PAD_L=80, PAD_R=500, W=16000;
// 深时非线性分段：前寒武压缩、显生宙放大
const BP=[[4567,0],[2500,0.14],[541,0.42],[66,0.72],[0,1]];

const x = ma => {
  ma = Math.min(Math.max(ma,0),4567);
  for(let i=0;i<BP.length-1;i++){
    const [m1,p1]=BP[i],[m2,p2]=BP[i+1];
    if(ma<=m1&&ma>=m2){const f=(m1-ma)/((m1-m2)||1);return PAD_L+(p1+f*(p2-p1))*(W-PAD_L-PAD_R);}
  }
  return W-PAD_R;
};
const tl = document.getElementById("timeline");

const TICKS=[[4500,"45亿年前"],[4000,"40亿年前"],[3500,"35"],[3000,"30"],[2500,"25亿年前"],[2000,"20"],[1500,"15"],
  [1000,"10亿年前"],[541,"5.41亿年前"],[400,"4"],[300,"3"],[200,"2"],[100,"1亿年前"],
  [66,"6600万"],[25,"2500万"],[5,"500万"],[0,"今天"]];
TICKS.forEach(([ma,lab])=>{
  const t=document.createElement("div"); t.className="tick"; t.style.left=x(ma)+"px";
  const l=document.createElement("div"); l.className="tick-label"; l.style.left=x(ma)+"px"; l.textContent=lab;
  tl.append(t,l);
});

// 宙/代阶段标题 + 核心变化
const ERA_COLOR={hadean:"#ae027e",archean:"#f0047f",proterozoic:"#f73563",paleozoic:"#99c08d",mesozoic:"#67c5ca",cenozoic:"#c9c22e"};

// ---- 纪色带（ICS 官方色谱，轴下）----
const PERIODS=[["成铁纪",2500,2300,"#f74f7c"],["层侵纪",2300,2050,"#f75b89"],["造山纪",2050,1800,"#f76898"],
  ["固结纪",1800,1600,"#f875a7"],["盖层纪",1600,1400,"#fdc07a"],["延展纪",1400,1200,"#fdcc8a"],
  ["狭带纪",1200,1000,"#fed99a"],["拉伸纪",1000,720,"#febf4e"],["成冰纪",720,635,"#fecc5c"],
  ["埃迪卡拉纪",635,538.8,"#fed96a"],
  ["寒武纪",538.8,486.85,"#7fa056"],["奥陶纪",486.85,443.1,"#009270"],["志留纪",443.1,419.62,"#b3e1b6"],
  ["泥盆纪",419.62,358.86,"#cb8c37"],["石炭纪",358.86,298.9,"#67a599"],["二叠纪",298.9,251.902,"#f04028"],
  ["三叠纪",251.902,201.4,"#812b92"],["侏罗纪",201.4,145.0,"#34b2c9"],["白垩纪",145.0,66,"#7fc64e"],
  ["古近纪",66,23.04,"#fd9a52"],["新近纪",23.04,2.58,"#ffe619"],["第四纪",2.58,0,"#f9f97f"]];
(function buildPeriods(){
  // 宙/代色带（页面最底部，ICS 官方色谱）
  const EONS=[["冥古宙",4567,4031,"#ae027e"],["太古宙",4031,2500,"#f0047f"],["元古宙",2500,538.8,"#f73563"],
              ["古生代",538.8,251.902,"#6fbf6f"],["中生代",251.902,66,"#5fb9d6"],["新生代",66,0,"#f9c46b"]];
  const eb=document.createElement("div"); eb.className="periods";
  EONS.forEach(([n,a,b,c])=>{
    const d=document.createElement("div");
    d.className="pcell"; d.textContent=n; d.style.background=c; d.title=n;
    const l=x(Math.min(a,4567)), r=x(Math.min(b,4567));
    d.style.left=l+"px"; d.style.width=Math.max(r-l,3)+"px";
    eb.appendChild(d);
  });
  tl.appendChild(eb);
  // 纪：竖线 + 竖排标签（色带上方）
  const pl=document.createElement("div"); pl.className="plines";
  PERIODS.forEach(([n,a,b,c])=>{
    const px=x(a);
    const line=document.createElement("div");
    line.className="pline"; line.style.left=px+"px";
    pl.appendChild(line);
    const lab=document.createElement("div");
    lab.className="plabel"; lab.textContent=n; lab.style.left=(px+4)+"px";
    pl.appendChild(lab);
  });
  tl.appendChild(pl);
})();
// 注：宙/代阶段旧竖线标签已移除——改由底部宙/代色带 + 纪竖线呈现；ERAS 数据保留供图例跳转使用

// ===== 三次转折：轴上的立柱标注 =====
const tip=document.createElement("div"); tip.id="detailTip"; document.body.appendChild(tip);
// 常驻关闭按钮（在 innerHTML 替换后自动恢复，见 MutationObserver）
const tipClose=document.createElement("button"); tipClose.id="tipClose"; tipClose.textContent="✕";
tipClose.title="关闭详情卡"; tipClose.setAttribute("aria-label","关闭详情卡");
tip.appendChild(tipClose);
// 字号调节：±调整详情卡字号（所有详情页全局生效），localStorage 记忆
const fontCtl=document.createElement("div"); fontCtl.className="tipFontCtl";
fontCtl.innerHTML=`<button data-d="-1" title="字号 −">−</button><span id="tipFontLbl" title="双击重置为 100%" style="cursor:pointer">100%</span><button data-d="1" title="字号 +">＋</button>`;
tip.appendChild(fontCtl);
let tipFontScale=parseFloat(localStorage.getItem("tipFontScale"))||1;
function applyTipFont(){ tipFontScale=Math.min(2,Math.max(.6,tipFontScale));
  tip.style.fontSize=(22*tipFontScale)+"px";
  fontCtl.querySelector("#tipFontLbl").textContent=Math.round(tipFontScale*100)+"%";
  localStorage.setItem("tipFontScale",tipFontScale); }
fontCtl.addEventListener("click",e=>{ const d=e.target.dataset&&e.target.dataset.d; if(!d)return;
  e.stopPropagation(); tipFontScale+= +d*0.1; applyTipFont(); });
fontCtl.addEventListener("dblclick",e=>{ if(e.target.id!=="tipFontLbl")return;
  e.stopPropagation(); tipFontScale=1; applyTipFont(); });
applyTipFont();
// 拖拽右下角手柄调整详情卡宽度（px），全局生效并记忆
const tipResize=document.createElement("div"); tipResize.id="tipResize"; tipResize.title="拖动调整卡片大小（向左拖变宽，向右拖变窄）";
tip.appendChild(tipResize);
let tipW=parseInt(localStorage.getItem("tipW"))||0;
if(tipW) tip.style.width=tipW+"px";
tipResize.addEventListener("mousedown",e=>{
  e.preventDefault(); e.stopPropagation();
  const sw=tip.getBoundingClientRect().width, sx=e.clientX;
  const mv=ev=>{ tipW=Math.round(Math.min(innerWidth-24,Math.max(340,sw+(sx-ev.clientX))));
    tip.style.width=tipW+"px"; };
  const up=()=>{ window.removeEventListener("mousemove",mv); window.removeEventListener("mouseup",up);
    localStorage.setItem("tipW",tipW); };
  window.addEventListener("mousemove",mv); window.addEventListener("mouseup",up);
});
new MutationObserver(()=>{ if(!tip.contains(tipClose)){tip.append(fontCtl,tipClose,tipResize);} })
  .observe(tip,{childList:true});
tipClose.addEventListener("click",e=>{ e.stopPropagation(); tip.style.display="none"; tip.classList.remove("show");
  window.dispatchEvent(new CustomEvent("tipclose")); });
TURNS.forEach(tn=>{
  const px=x(tn.ma);
  const pole=document.createElement("div");
  pole.style.cssText="position:absolute;left:0;top:6%;bottom:22%;width:0;border:none;";
  tl.appendChild(pole);
  const badge=document.createElement("div");
  badge.style.cssText=`position:absolute;left:${px}px;top:4%;transform:translateX(-50%);z-index:5;text-align:center;white-space:nowrap;cursor:help;display:none;`;
  badge.innerHTML=`<div style="background:${tn.c};color:#fff;font-weight:700;font-size:19px;padding:5px 12px;border-radius:16px;box-shadow:0 2px 8px ${tn.c}44;">⚑ ${tn.t}</div>
    <div style="font-size:17px;color:${tn.c};font-weight:600;margin-top:3px;">${tn.s}</div>`;
  badge.addEventListener("mouseenter",()=>{
    tip.innerHTML=`<h3 style="color:${tn.c};">⚑ ${tn.t}：${tn.s}</h3><div class="who">${tn.ma>=100 ? Math.round(tn.ma)+" Ma 前后" : tn.ma+" Ma 前后"}</div><p>${tn.d}</p>`;
    tip.style.display="block";
    const r=badge.getBoundingClientRect(); const w=340,h=tip.offsetHeight||140;
    let x1=r.left, y1=r.bottom+12;
    if(y1+h>innerHeight-12) y1=Math.max(12,r.top-h-12);
    x1=Math.max(12,Math.min(x1,innerWidth-w-12));
    tip.style.left=x1+"px"; tip.style.top=y1+"px";
  });
  badge.addEventListener("mouseleave",()=>{tip.style.display="none";});
  tl.appendChild(badge);
});

// ===== （数据维度已合并进底部阶段说明）=====

// ===== 右端终点站：三个过渡问题 =====

// ===== 事件布局 =====
const CARD_W=330, GAP=130;
const bounds={1:[], "-1":[]};
function tryPlace(px, side){
  const rs=bounds[side];
  for(let r=0;r<=rs.length;r++){
    const rb=rs[r]!==undefined?rs[r]:-Infinity;
    if(px-rb>=CARD_W/2+GAP) return r;
  }
  return -1;
}
const placed=EVENTS.slice().sort((a,b)=>b.ma-a.ma).map((ev,i)=>{
  const px=x(ev.ma);
  const first=ev.side!==undefined?ev.side:(i%2===0?1:-1);
  let side=first,row=tryPlace(px,side);
  if(row<0){side=-first;row=tryPlace(px,side);}
  if(row<0){side=first;row=bounds[side].length;}
  bounds[side][row]=Math.max(bounds[side][row]!==undefined?bounds[side][row]:-Infinity,px+CARD_W/2);
  return {...ev,side,row};
});

for (const ev of placed) {
  const el=document.createElement("div");
  el.className="event "+(ev.side>0?"up":"dn")+" "+ev.c;
  el.dataset.name=ev.n; el.dataset.pi=placed.indexOf(ev);
  el.style.left=x(ev.ma)+"px"; el.style.top="50%"; el.style.height="0";
  el.style.color=CAT_COLOR[ev.c];

  const stemLen=(ev.lv===1?34:22)+ev.row*72;
  const stem=document.createElement("div"); stem.className="stem"; stem.style.height=stemLen+"px";
  if(ev.side>0) stem.style.bottom="0"; else stem.style.top="0";

  const dot=document.createElement("div"); dot.className="dot";
  const dsz=ev.c==="ghost"?18:(ev.lv===1?15:10);
  dot.style.width=dot.style.height=dsz+"px";
  if(ev.c==="ghost"){ dot.style.background="transparent"; dot.style.border="2.5px dashed currentColor"; }
  dot.style.top=ev.side>0?(-stemLen)+"px":stemLen+"px";

  const card=document.createElement("div"); card.className="card";
  if(ev.side>0){ card.style.top="auto"; card.style.bottom=(stemLen+6)+"px"; }
  else { card.style.top=(stemLen+6)+"px"; }
  card.innerHTML=`<div class="name">${ev.c==="ext"?"★ ":""}${ev.n}</div><div class="meta">${ev.yr}</div>`;

  const det=document.createElement("div"); det.style.display="none"; det.className="det";
  const localImg=(typeof WIKI_IMG!=="undefined"&&ev.wiki&&((typeof EVENT_IMG!=="undefined"&&EVENT_IMG[ev.n])||WIKI_IMG[decodeURIComponent(ev.wiki.split("/wiki/")[1])]))||null;

  det.innerHTML=
    `<h3>${ev.wiki?`<a href="${ev.wiki}" target="_blank" rel="noopener">${ev.n}</a>`:ev.n}</h3>`+
    `<div class="who">${ev.w} · ${ev.yr}</div>`+
    `<p>${ev.d}</p>`+
    ((localImg&&ev.gossip)?`<div class="det-flex">
       <a href="${ev.wiki}" target="_blank" rel="noopener" class="det-img-link"><img src="img/${localImg}" class="det-img"></a>
       <div class="note det-note">📖 ${ev.wiki?`<b><a href="${ev.wiki}" target="_blank" rel="noopener">${ev.gossip.t}</a></b>`:`<b>${ev.gossip.t}</b>`}<br>${ev.gossip.s}</div>
     </div>`
     :localImg?`<div class="det-img-only"><a href="${ev.wiki}" target="_blank" rel="noopener"><img src="img/${localImg}" class="det-img-sm"></a></div>`
     :ev.gossip?`<div class="note det-note-only">📖 ${ev.wiki?`<b><a href="${ev.wiki}" target="_blank" rel="noopener">${ev.gossip.t}</a></b>`:`<b>${ev.gossip.t}</b>`}<br>${ev.gossip.s}</div>`:"");

  el.append(stem,dot,card,det);
  tl.appendChild(el);
}

(function tooltip(){
  let activeEv=null;
  function showFor(ev){
    const detEl=ev.querySelector(".det")||[...ev.children].find(c=>c.style.display==="none");
    if(!detEl)return;
    tip.innerHTML=`<div class="detail">${detEl?detEl.innerHTML:""}</div>`;
    tip.style.color=getComputedStyle(ev).color;
    tip.style.display="block";
    tip.classList.remove("show");
    setTimeout(()=>tip.classList.add("show"),30);   // 淡入（与时间之旅一致）

    // 与时间之旅一致：固定右上（窄屏由媒体查询覆盖为底部抽屉）
    tip.style.left="auto";tip.style.right="12px";
    tip.style.top="70px";
    tip.style.bottom="auto";
    tip.style.maxHeight=(innerHeight-100)+"px";
    tip.style.overflowY="auto";
  }
  // 触屏/鼠标点击事件点 → 显示详情卡（hover 在触屏不可用）
  document.addEventListener("click",e=>{
    if(tip.contains(e.target)) return;                 // 卡内点击不处理
    if(e.target.closest("#tipClose")) return;
    const ev=e.target.closest(".event");
    if(ev){ activeEv=ev; showFor(ev); }
    else if(!e.target.closest("header,.legend,.tour-ctl")){
      tip.style.display="none"; tip.classList.remove("show"); activeEv=null;         // 点时间线空白处关闭
    }
  });
  document.addEventListener("mouseover",e=>{
    const ev=e.target.closest(".event");
    if(ev && ev!==activeEv){
      activeEv=ev;
      showFor(ev);
    }
    // 不再在移开时隐藏：卡片固定右上供阅读，用 ✕ / 点空白 / 滚动关闭
  });
  const vp=document.getElementById("viewport");
  // 相机模式下没有 scroll 事件：拖拽/飞行开始即关闭详情卡
  vp.addEventListener("mousedown",()=>{ if(window.__touring) return; tip.style.display="none"; tip.classList.remove("show");activeEv=null; });
  // bioinfo 模式：hover 只开不关，关闭统一用 ✕ / 点空白 / 拖拽
})();

// ===== 交互：地图式相机（拖拽平移 + 滚轮滚动 + Ctrl/双指缩放 + 缓动飞行）=====
const vp=document.getElementById("viewport");
const stage=document.getElementById("timeline");
let view={s:1,tx:0,ty:0}, animId=null;
function clamp(v,lo,hi){return v<lo?lo:(v>hi?hi:v);}
function apply(){ stage.style.transform=`translate(${view.tx}px,${view.ty}px) scale(${view.s})`; }
// easeInOutCubic
const easeT=t=>t<.5?4*t*t*t:1-Math.pow(-2*t+2,3)/2;
function animateTo(ts,ttx,tty,dur=700,done){
  if(animId)cancelAnimationFrame(animId);
  const s0=view.s,tx0=view.tx,ty0=view.ty,t0=performance.now();
  const step=now=>{
    const k=Math.min(1,(now-t0)/dur),e=easeT(k);
    view.s=s0+(ts-s0)*e; view.tx=tx0+(ttx-tx0)*e; view.ty=ty0+(tty-ty0)*e;
    apply();
    if(k<1)animId=requestAnimationFrame(step);
    else{animId=null;done&&done();}
  };
  animId=requestAnimationFrame(step);
}
function stopAnim(){ if(animId){cancelAnimationFrame(animId);animId=null;} }
// 年份 → 让该年份居中的 tx
function txForYear(y,s){ return vp.clientWidth/2 - x(y)*s; }
function clampTx(tx,s){ return clamp(tx, vp.clientWidth - W*s - 40, 40); }
// 初始：起点年代靠左
view.tx=clampTx(txForYear(T0+8,1),1); view.s=1; apply();
window.addEventListener("resize",()=>{ view.tx=clampTx(view.tx,view.s); apply(); });

// 拖动平移（带惯性）；touchSeen：触摸设备上屏蔽 touch 后合成的鼠标事件，避免两套平移互相打架（轴上下晃动的根源）
let dragging=false,sx=0,oTx=0,vx=0,lastX=0,lastT=0,touchSeen=false;
vp.addEventListener("touchstart",()=>{touchSeen=true;},{passive:true});
vp.addEventListener("mousedown",e=>{
  if(touchSeen) return;   // 触摸产生的合成 mousedown，跳过
  if(tip.contains(e.target)) return;   // 详情卡内拖动选择文本，不拖时间线
  stopAnim(); dragging=true; sx=e.clientX;
  oTx=view.tx; vx=0; lastX=e.clientX; lastT=performance.now();
  vp.classList.add("dragging");
});
window.addEventListener("mousemove",e=>{
  if(!dragging)return;
  view.tx=clampTx(oTx+(e.clientX-sx),view.s);   // 只水平平移，垂直方向锁死，避免上下跳动
  const now=performance.now();
  if(now-lastT>0){ vx=(e.clientX-lastX)/(now-lastT); }   // px/ms
  lastX=e.clientX; lastT=now;
  apply();
});
window.addEventListener("mouseup",()=>{
  if(!dragging)return;
  dragging=false; vp.classList.remove("dragging");
  // 惯性滑动：按松手速度衰减滑行
  if(Math.abs(vx)>0.15){
    const v=vx, t0=performance.now(), dur=1400, decay=1/900;
    const glide=now=>{
      if(dragging)return;
      const dt=now-t0, f=Math.exp(-dt*decay)*v;
      if(Math.abs(f)<0.01)return;
      const tx2=clampTx(view.tx+f*16,view.s);
      if(tx2===view.tx&&Math.abs(f)>0.02)return;   // 撞到边缘
      view.tx=tx2; apply();
      requestAnimationFrame(glide);
    };
    requestAnimationFrame(glide);
  }
});
// 滚轮：普通 = 平移；Ctrl/Cmd = 以鼠标为焦点缩放
vp.addEventListener("wheel",e=>{
  if(tip.contains(e.target)) return;   // 详情卡内滚动不劫持
  stopAnim(); e.preventDefault();
  if(e.ctrlKey||e.metaKey){
    const f=Math.exp(-e.deltaY*0.0015);
    const ns=clamp(view.s*f,0.02,2.5), k=ns/view.s;
    view.tx=e.clientX-(e.clientX-view.tx)*k;
    view.ty=e.clientY-(e.clientY-view.ty)*k;
    view.s=ns;
  }else{
    const d=Math.abs(e.deltaX)>Math.abs(e.deltaY)?e.deltaX:e.deltaY;
    view.tx=clampTx(view.tx-d,view.s);
  }
  apply();
},{passive:false});
// 触屏：单指平移，双指捏合缩放
let ts=null;
vp.addEventListener("touchstart",e=>{
  stopAnim();
  if(e.touches.length===1) ts={x:e.touches[0].clientX,y:e.touches[0].clientY,tx:view.tx,ty:view.ty};
  else if(e.touches.length>=2){const dx=e.touches[0].clientX-e.touches[1].clientX,dy=e.touches[0].clientY-e.touches[1].clientY;ts={d:Math.hypot(dx,dy),s:view.s,tx:view.tx,ty:view.ty,px:(e.touches[0].clientX+e.touches[1].clientX)/2,py:(e.touches[0].clientY+e.touches[1].clientY)/2};}
},{passive:true});
vp.addEventListener("touchmove",e=>{
  if(e.touches.length===1&&ts&&ts.x!==undefined){
    view.tx=clampTx(ts.tx+(e.touches[0].clientX-ts.x),view.s);
    // 未放大时纵向锁死：轴不再上下晃；放大后才允许纵向平移
    const yLo=vp.clientHeight-vp.clientHeight*view.s;
    view.ty=yLo<0?clamp(ts.ty+(e.touches[0].clientY-ts.y),yLo,0):0;
    apply();
  }else if(e.touches.length===2&&ts&&ts.d){
    const dx=e.touches[0].clientX-e.touches[1].clientX,dy=e.touches[0].clientY-e.touches[1].clientY;
    const nd=Math.hypot(dx,dy);
    const mx=(e.touches[0].clientX+e.touches[1].clientX)/2, my=(e.touches[0].clientY+e.touches[1].clientY)/2;
    // 地图式捏合：手势开始时两指中点下的画布内容点，缩放后始终贴在当前两指中点
    // → 捏合缩放以中点为锚；双指整体平移时画面跟手
    const ns=clamp(ts.s*(nd/ts.d),0.02,2.5);
    const c0x=(ts.px-ts.tx)/ts.s, c0y=(ts.py-ts.ty)/ts.s;
    view.tx=clampTx(mx-c0x*ns,ns);
    const yLo=vp.clientHeight-vp.clientHeight*ns;
    view.ty=yLo<0?clamp(my-c0y*ns,yLo,0):0;
    view.s=ns;
    apply();
  }
},{passive:true});
// 平移时关闭详情卡（拖拽开始时触发）

// ===== 图例按钮：缓动飞行到该区段第一个事件 =====
document.querySelectorAll(".legend span[data-cat]").forEach(btn=>{
  btn.addEventListener("click",()=>{
    const cat=btn.dataset.cat;
    const first=placed.filter(e=>e.c===cat)[0]; // placed 按 ma 降序，首个即该类别最古老事件
    if(!first)return;
    tip.style.display="none"; tip.classList.remove("show");
    const tTx=clampTx(txForYear(first.ma,view.s),view.s);
    animateTo(view.s,tTx,view.ty,900);
  });
});

setTimeout(()=>{document.getElementById("hint").style.opacity=0;},6000);

// ===== 时间之旅：逐个放映详情卡 =====
(function(){
  const btn=document.getElementById("tourBtn");
  const prevBtn=document.getElementById("tourPrev");
  const nextBtn=document.getElementById("tourNext");
  const spdBtn=document.getElementById("tourSlower");
  const spdUp=document.getElementById("tourFaster");
  const secLbl=document.getElementById("tourSecs");
  const vp2=document.getElementById("viewport");   // 相机模式：平移由上面的 view/apply 负责
  let timer=null, idx=0, on=false, paused=false;
  const seq=placed.slice();   // placed 已按年份排序
  let staySec=6;              // 每站卡片显示净时长（秒），另有飞行动画时间
  const FLY_MS=820+800;       // 飞行动画800ms + 显示延迟820ms，不计入停留
  secLbl.title="每站停留 6 秒";
  function stayMs(){ return staySec*1000; }
  function setStay(d){ staySec=Math.min(30,Math.max(1,staySec+d)); secLbl.textContent=staySec+"s";
    secLbl.title="每站停留 "+staySec+" 秒"; if(on) arm(); }

  function arm(){ clearInterval(timer); timer=setInterval(()=>{idx=nextIdx(idx); step();}, stayMs()+FLY_MS); }

  function nextIdx(i){ return (i+1)%seq.length; }
  function prevIdx(i){ return (i-1+seq.length)%seq.length; }

  function showTipFor(i){
    const ev=seq[i];
    const el=document.querySelector(`.event[data-pi="${i}"]`);
    if(!el) return;
    tip.style.left="auto";tip.style.right="12px";   // 固定在右侧（窄屏由媒体查询覆盖为底部抽屉）
    tip.style.top="70px";
    tip.style.bottom="auto"; tip.style.maxHeight=(innerHeight-100)+"px";
    tip.style.overflowY="auto";
    const detEl=el.querySelector(".det");
    tip.innerHTML=`<div class="detail">${detEl?detEl.innerHTML:""}</div>`;
    tip.style.color=getComputedStyle(el).color;
    tip.style.display="block";
    tip.classList.remove("show");
    setTimeout(()=>tip.classList.add("show"),30);   // 下一帧再淡入（后台标签页 rAF 会被暂停，用 setTimeout 更稳）
    // 站点序号徽标
    const badge=document.createElement("div");
    badge.textContent=`🧭 时间之旅 · 第 ${i+1} / ${seq.length} 站`;
    badge.style.cssText="font-weight:700;color:#7F5AF0;font-size:13px;margin-bottom:4px;";
    tip.insertBefore(badge,tip.firstChild);
  }
  function step(){
    const ev=seq[idx];
    const tTx=clampTx(txForYear(ev.ma,view.s),view.s);
    animateTo(view.s,tTx,view.ty,800);
    setTimeout(()=>showTipFor(idx), 820);
  }
  function stop(){
    window.__touring=false; on=false; paused=false; btn.classList.remove("on"); btn.textContent="▶";
    btn.title="时间之旅（空格暂停/继续，Esc 退出）";
    clearInterval(timer); tip.style.display="none"; tip.classList.remove("show");
    tip.style.maxHeight=""; tip.style.overflowY=""; tip.style.color="";
  }
  function pause(){
    on=false; paused=true; btn.textContent="▶";
    clearInterval(timer);           // 保留当前卡片显示，不隐藏
  }
  // 用户点详情卡上的 ✕ 时，若正在播放则一并停止导览
  window.addEventListener("tipclose",()=>{ if(on||paused) stop(); });
  function start(keepIdx){
    if(!keepIdx&&!paused) idx=0;
    window.__touring=true; on=true; paused=false; btn.classList.add("on"); btn.textContent="⏸";
    step(); arm();
  }
  btn.addEventListener("click",()=>{ on?pause():start(true); });
  prevBtn.addEventListener("click",()=>{ idx=prevIdx(idx); if(on){step();arm();}else{window.__touring=true;step();} });
  nextBtn.addEventListener("click",()=>{ idx=nextIdx(idx); if(on){step();arm();}else{window.__touring=true;step();} });
  spdBtn.addEventListener("click",()=>setStay(-1));
  spdUp.addEventListener("click",()=>setStay(1));
  window.addEventListener("keydown",e=>{
    if(e.code==="Escape" && on){ stop(); return; }   // Esc 退出导览
    if(e.code!=="Space") return;
    const t=e.target && e.target.tagName;
    if(t==="INPUT"||t==="TEXTAREA") return;
    e.preventDefault();
    on?pause():start(true);   // 空格暂停/继续（与按钮一致）
  });
})();

// ===== 全屏切换 =====
(function(){
  const fsBtn=document.getElementById("fsBtn");
  fsBtn.addEventListener("click",()=>{
    if(document.fullscreenElement) document.exitFullscreen();
    else document.documentElement.requestFullscreen().catch(()=>{});
  });
  document.addEventListener("fullscreenchange",()=>{
    fsBtn.title=document.fullscreenElement?"退出全屏":"进入全屏";
  });
})();
