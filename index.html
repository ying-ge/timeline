<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>时间线 · Timeline</title>
<style>
  :root {
    --bg:#0d0b14; --bg2:#141021; --ink:#e8e2d5; --dim:#8f8899;
    --gold:#c9a86a; --green:#7fb069; --cyan:#5cc8d7; --line:rgba(201,168,106,.25);
  }
  * { box-sizing:border-box; }
  html { font-size:clamp(13px, 1.05vw + 0.55rem, 19px); }   /* 全站字号随视口缩放 */
  body {
    margin:0; min-height:100vh; display:flex; flex-direction:column; align-items:center;
    font-family:"Songti SC","Noto Serif SC","PingFang SC","Hiragino Sans GB",serif;
    color:var(--ink);
    background:
      radial-gradient(1200px 500px at 20% -10%, rgba(92,200,215,.07), transparent 60%),
      radial-gradient(900px 500px at 85% 110%, rgba(201,168,106,.08), transparent 60%),
      linear-gradient(180deg, var(--bg) 0%, var(--bg2) 100%);
    overflow-x:hidden;
  }
  /* 星尘 */
  .stars, .stars::after { content:""; position:fixed; inset:0; pointer-events:none;
    background-image:
      radial-gradient(1px 1px at 12% 22%, rgba(232,226,213,.5), transparent 100%),
      radial-gradient(1.5px 1.5px at 68% 12%, rgba(201,168,106,.4), transparent 100%),
      radial-gradient(1px 1px at 84% 38%, rgba(92,200,215,.5), transparent 100%),
      radial-gradient(1px 1px at 32% 62%, rgba(232,226,213,.35), transparent 100%),
      radial-gradient(1.5px 1.5px at 55% 84%, rgba(232,226,213,.3), transparent 100%),
      radial-gradient(1px 1px at 90% 72%, rgba(201,168,106,.4), transparent 100%),
      radial-gradient(1px 1px at 8% 80%, rgba(92,200,215,.35), transparent 100%);
  }
  main { position:relative; text-align:center; padding:clamp(40px,7vh,90px) clamp(16px,4vw,48px) 48px;
    width:min(92vw, 1200px); }

  .seal { width:64px; height:64px; margin:0 auto 20px; border:1.5px solid var(--gold);
    border-radius:10px; display:flex; align-items:center; justify-content:center;
    font-size:1.5rem; color:var(--gold); letter-spacing:0; line-height:1.2;
    writing-mode:vertical-rl; font-weight:700;
    box-shadow:0 0 24px rgba(201,168,106,.25) inset, 0 0 18px rgba(201,168,106,.15); }
  h1 { font-size:clamp(1.9rem, 3.4vw + 0.6rem, 3.4rem); margin:0 0 10px; font-weight:700; letter-spacing:.12em; }
  h1 .en { display:block; font-size:.85rem; letter-spacing:.6em; color:var(--dim);
    font-family:"Georgia",serif; text-transform:uppercase; margin-top:10px; padding-left:.6em; }
  p.sub { color:var(--dim); margin:22px auto 8px; font-size:1.02rem; line-height:1.9; max-width:560px; }

  /* 主时间轴：总体时间线（40亿年前 → 2100），4 个主题按其时间区间定位 */
  .axis { position:relative; height:2px; margin:clamp(28px,5vh,56px) auto 8px; width:100%;
    background:linear-gradient(90deg, transparent 0%, var(--gold) 6%, var(--gold) 60%, var(--cyan) 92%, transparent 100%); }
  .axis .node { position:absolute; top:50%; width:9px; height:9px; border-radius:50%;
    transform:translate(-50%,-50%); background:var(--bg); border:1.5px solid var(--gold);
    transition:.2s; }
  .axis .node.future { border-color:var(--cyan); }
  .axis .node.on { width:15px; height:15px; box-shadow:0 0 14px currentColor;
    background:currentColor; z-index:4; }
  .axis .node em { position:absolute; left:50%; bottom:16px; transform:translateX(-50%);
    font-style:normal; font-size:.72rem; white-space:nowrap; color:var(--ink);
    letter-spacing:.12em; opacity:0; transition:.2s; text-shadow:0 1px 4px rgba(0,0,0,.8); }
  .axis .node.on em { opacity:1; bottom:20px; }

  /* 主题区间：横条 + 标签，悬停高亮 */
  .ranges { position:relative; width:100%; margin:0 auto 10px; height:calc(4 * var(--rowh) + 1rem); }
  .ranges .rg { position:absolute; height:14px; border-radius:7px; opacity:.8; cursor:pointer;
    transition:.2s; }
  .ranges .rg:hover, .ranges .rg.on { opacity:1; transform:scaleY(1.35); box-shadow:0 4px 14px rgba(0,0,0,.4); z-index:5; }
  .ranges .rg i { position:absolute; left:50%; top:50%; transform:translate(-50%,-50%);
    font-style:normal; font-size:.78rem; white-space:nowrap; color:rgba(232,226,213,.95);
    letter-spacing:.08em; text-shadow:0 1px 3px rgba(0,0,0,.6); }
  .axis-cap { width:100%; margin:0 auto 18px; display:flex; justify-content:space-between;
    font-size:.78rem; color:var(--dim); letter-spacing:.15em; flex-wrap:wrap; gap:4px 12px; }

  /* 悬停浮现的主题介绍面板 */
  .stage { display:none; }

  footer { margin-top:clamp(28px,6vh,64px); font-size:.78rem; color:var(--dim); letter-spacing:.15em; }
  footer .sep { color:var(--gold); margin:0 10px; }
  @media (max-width:600px){
    h1{ font-size:1.9rem; }
    .ranges .rg i{ font-size:.68rem; }
  }
</style>
</head>
<body>
<div class="stars"></div>
<main>
  <div class="seal">時間</div>
  <h1>时间线<span class="en">Timeline · From Antiquity to Tomorrow</span></h1>
  <p class="sub">一条轴，贯通过去与未来。从手写的博物笔记，到运行在硅与光之上的智能——每个主题，都是人类认知边界的一次推移。</p>

  <div class="axis" id="axis"></div>
  <div class="ranges" id="ranges"></div>
  <div class="axis-cap"><span>40 亿年前 · 生命诞生</span><span>1800s</span><span>今天</span><span>2035 · 未来</span></div>

  <footer>传统<span class="sep">·</span>科技<span class="sep">·</span>时间深处的回声与未来之光</footer>
</main>
<script>
/* ===== 主页总体时间线：4 个主题按时间区间定位 ===== */
function pct(years){
  // 分段：40亿年前→1800 占 0–50%（压缩远古），1800→2035 占 50–100%
  const a=-4e9, pivot=1800, b=2035;
  if(years<=pivot) return 50*(years-a)/(pivot-a);
  return 50+50*(years-pivot)/(b-pivot);
}
const THEMES=[
  { href:"geotime/",  a:-4.567e9, b:0, color:"#f73563", name:"深时地球", row:0,
    era:"45.67 亿年前 — 今天 · 深时", t:"深时 · 地球与生命", glyph:"🌍",
    d:"地质年代（宙·代·纪）、五次大灭绝与生命演化大事——唯一维护版本" },
  { href:"darwin/",    a:1809,  b:1950, color:"#c9a86a", name:"演化思想", row:1,
    era:"1809 — 1950s · 溯源", t:"生物演化思想", glyph:"🧬",
    d:"从拉马克的手稿到现代综合——一个想法如何在两百年间慢慢长成科学" },
  { href:"bioinfo/",   a:1950,  b:2026, color:"#5cc8d7", name:"AI×生命", row:2,
    era:"1950s — 2020s · 转译", t:"AI 解码生命", glyph:"🧪",
    d:"当生物学的答案藏进数据库，算法开始读懂生命的语言" },
  { href:"ai/",        a:1950,  b:2035, color:"#7fb069", name:"AI 发展", row:3,
    era:"1950s — 2035 · 觉醒", t:"AI 发展：从规则到 Agent", glyph:"🤖",
    d:"七十余年，机器如何从执行指令，走向自己提出方案" },
];
(function build(){
  const axis=document.getElementById("axis"), ranges=document.getElementById("ranges");
  // 行距随字号缩放（html font-size 用 clamp 随视口变化）
  const rowH=()=>Math.round(parseFloat(getComputedStyle(document.documentElement).fontSize)*1.9);
  THEMES.forEach(t=>{
    const l=pct(t.a), r=pct(t.b);
    // 轴上节点（悬停时高亮 + 年份标签）
    const n=document.createElement("span");
    n.className="node"+(t.b>2025?" future":"");
    n.style.left=((l+r)/2)+"%";
    n.style.color=t.color;
    n.innerHTML=`<em>${t.a<0?"约38亿年前 · 生命诞生":(t.a===1809?"1809 · 溯源":(t.name==="AI×生命"?"1950s · 转译":"1950s · 觉醒"))}</em>`;
    axis.appendChild(n);
    // 区间横条
    const rg=document.createElement("a");
    rg.className="rg"; rg.href=t.href;
    rg.style.left=l+"%"; rg.style.width=(r-l)+"%";
    rg.style.top="calc(var(--rowh) * "+t.row+" + 0.5rem)";
    rg.style.background="linear-gradient(90deg,"+t.color+"cc,"+t.color+"88)";
    rg.innerHTML=`<i>${t.name}</i>`;
    rg.addEventListener("mouseenter",()=>{
      document.querySelectorAll(".rg").forEach(x=>x.classList.remove("on"));
      rg.classList.add("on");
      document.querySelectorAll(".axis .node").forEach(x=>x.classList.remove("on"));
      n.classList.add("on");
    });
    ranges.appendChild(rg);
  });
  // 行高 CSS 变量随视口更新
  const syncRow=()=>document.documentElement.style.setProperty("--rowh", rowH()+"px");
  syncRow(); window.addEventListener("resize", syncRow);
  ranges.addEventListener("mouseleave",()=>{
    document.querySelectorAll(".rg").forEach(x=>x.classList.remove("on"));
    document.querySelectorAll(".axis .node").forEach(x=>x.classList.remove("on"));
  });
})();
</script>
</body>
</html>
